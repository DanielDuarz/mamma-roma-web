<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="flag-rounded">
      <rect x="2" y="5" width="28" height="22" rx="4" ry="4" />
    </clipPath>
    <filter id="shadow" x="0" y="3" width="32" height="28" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g clip-path="url(#flag-rounded)">
      <!-- Green -->
      <rect x="2" y="5" width="9.34" height="22" fill="#009246" />
      <!-- White -->
      <rect x="11.34" y="5" width="9.34" height="22" fill="#FFFFFF" />
      <!-- Red -->
      <rect x="20.68" y="5" width="9.34" height="22" fill="#CE2B37" />
    </g>
    <!-- Border -->
    <rect x="2" y="5" width="28" height="22" rx="4" ry="4" fill="none" stroke="#2c3032" stroke-width="1.2" stroke-opacity="0.8" />
  </g>
</svg>